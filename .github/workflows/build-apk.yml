name: בניית APK ואתר

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: אתר (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: אפליקציה (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle Excel/MP3 libraries inside the app (works offline)
        run: |
          mkdir -p www/lib
          if curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/lib/xlsx.full.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#lib/xlsx.full.min.js#' www/index.html
          fi
          if curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js -o www/lib/lame.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js#lib/lame.min.js#' www/index.html
          fi

      - name: Create Android project
        run: npx cap add android

      - name: App icon, splash, version and fixed signing key
        run: |
          unzip -o -q android-res.zip -d android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          // חתימה קבועה — כדי שכל גרסה חדשה תותקן מעל הקודמת בלי למחוק נתונים
          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../app-signing.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk luach-mischakim.apk

      - name: Upload APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: luach-mischakim-apk
          path: luach-mischakim.apk

      - name: Publish to Releases (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: לוח משחקים 2.0.${{ github.run_number }}
          body: הורד את הקובץ luach-mischakim.apk מהטלפון והתקן אותו.
          files: luach-mischakim.apk
          make_latest: true
